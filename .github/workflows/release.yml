name: release

# Publishes to PyPI when a GitHub release is published, via Trusted Publishing (OIDC):
# no token exists anywhere to leak. One-time setup on PyPI: project servseal ->
# Publishing -> add GitHub publisher owner=riscoss63, repository=servseal,
# workflow=release.yml, environment=pypi.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: the probes must ship, or every install is broken
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          ok = any(n.endswith("probes/default-v1.txt") for n in names)
          print(("OK  " if ok else "MISSING ") + "bundled probe set in " + whl)
          sys.exit(0 if ok else 1)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
